name: CI Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: devil-ai-production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Lint and deploy to SFTP
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PHP CLI and SFTP client
        run: |
          sudo apt-get update
          sudo apt-get install -y php-cli lftp

      - name: PHP syntax check
        run: |
          find . \
            -path './data' -prune -o \
            -path './.git' -prune -o \
            -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Deploy via SFTP
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_TARGET: ${{ secrets.SFTP_TARGET }}
        run: |
          set -euo pipefail
          : "${SFTP_HOST:?Missing SFTP_HOST secret}"
          : "${SFTP_PORT:?Missing SFTP_PORT secret}"
          : "${SFTP_USERNAME:?Missing SFTP_USERNAME secret}"
          : "${SFTP_PASSWORD:?Missing SFTP_PASSWORD secret}"
          : "${SFTP_TARGET:?Missing SFTP_TARGET secret}"

          lftp -u "$SFTP_USERNAME","$SFTP_PASSWORD" -p "$SFTP_PORT" "sftp://$SFTP_HOST" <<EOF
          set sftp:auto-confirm yes
          set net:timeout 30
          set net:max-retries 2
          set mirror:parallel-transfer-count 2
          mkdir -p "$SFTP_TARGET"
          mirror -R --verbose \
            --exclude-glob .git/** \
            --exclude-glob .github/** \
            --exclude-glob data/** \
            --exclude-glob node_modules/** \
            --exclude-glob vendor/** \
            --exclude-glob .DS_Store \
            ./ "$SFTP_TARGET"
          bye
          EOF

      - name: Patch live runtime mail config
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_TARGET: ${{ secrets.SFTP_TARGET }}
          DEVIL_SMTP_HOST: ${{ secrets.DEVIL_SMTP_HOST }}
          DEVIL_SMTP_PORT: ${{ secrets.DEVIL_SMTP_PORT }}
          DEVIL_SMTP_SECURE: ${{ secrets.DEVIL_SMTP_SECURE }}
          DEVIL_SMTP_USERNAME: ${{ secrets.DEVIL_SMTP_USERNAME }}
          DEVIL_SMTP_PASSWORD: ${{ secrets.DEVIL_SMTP_PASSWORD }}
          DEVIL_MAIL_FROM_EMAIL: ${{ secrets.DEVIL_MAIL_FROM_EMAIL }}
          DEVIL_MAIL_FROM_NAME: ${{ secrets.DEVIL_MAIL_FROM_NAME }}
          DEVIL_MAIL_REPLY_TO: ${{ secrets.DEVIL_MAIL_REPLY_TO }}
          DEVIL_MAIL_TRANSPORT: ${{ secrets.DEVIL_MAIL_TRANSPORT }}
          DEVIL_RESEND_API_KEY: ${{ secrets.DEVIL_RESEND_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${DEVIL_SMTP_PASSWORD:-}" ] && [ -z "${DEVIL_RESEND_API_KEY:-}" ]; then
            echo "No mail provider secrets set; skipping runtime mail config patch."
            exit 0
          fi
          mkdir -p .deploy_runtime
          lftp -u "$SFTP_USERNAME","$SFTP_PASSWORD" -p "$SFTP_PORT" "sftp://$SFTP_HOST" <<EOF
          set sftp:auto-confirm yes
          set net:timeout 30
          set net:max-retries 2
          mkdir -p "$SFTP_TARGET/data"
          get "$SFTP_TARGET/data/config.json" -o .deploy_runtime/config.json || true
          bye
          EOF
          python3 - <<'PY'
          import json, os, pathlib
          path = pathlib.Path('.deploy_runtime/config.json')
          try:
              cfg = json.loads(path.read_text()) if path.exists() and path.read_text().strip() else {}
          except Exception:
              cfg = {}
          if not isinstance(cfg, dict):
              cfg = {}
          transport = (os.environ.get('DEVIL_MAIL_TRANSPORT') or '').strip().lower()
          if transport not in {'mail', 'smtp', 'resend'}:
              transport = 'resend' if os.environ.get('DEVIL_RESEND_API_KEY') else 'smtp'
          patch = {
              'mail_transport': transport,
              'mail_from_email': os.environ.get('DEVIL_MAIL_FROM_EMAIL') or ('noreply@mail.blazepanel.mywp.info' if transport == 'resend' else 'noreply@blazepanel.mywp.info'),
              'mail_from_name': os.environ.get('DEVIL_MAIL_FROM_NAME') or 'Devil AI',
              'mail_reply_to': os.environ.get('DEVIL_MAIL_REPLY_TO') or 'bk.w.p.bk@gmail.com',
          }
          if os.environ.get('DEVIL_RESEND_API_KEY'):
              patch['resend_api_key'] = os.environ.get('DEVIL_RESEND_API_KEY')
          if os.environ.get('DEVIL_SMTP_PASSWORD') or os.environ.get('DEVIL_SMTP_HOST'):
              patch.update({
                  'smtp_host': os.environ.get('DEVIL_SMTP_HOST') or 'relay.dnsexit.com',
                  'smtp_port': int(os.environ.get('DEVIL_SMTP_PORT') or '587'),
                  'smtp_secure': os.environ.get('DEVIL_SMTP_SECURE') or 'tls',
                  'smtp_username': os.environ.get('DEVIL_SMTP_USERNAME') or '',
                  'smtp_password': os.environ.get('DEVIL_SMTP_PASSWORD') or '',
              })
          cfg.update(patch)
          emails = cfg.get('admin_emails')
          if not isinstance(emails, list):
              emails = []
          if 'bk.w.p.bk@gmail.com' not in [str(x).lower() for x in emails]:
              emails.append('bk.w.p.bk@gmail.com')
          cfg['admin_emails'] = emails
          path.write_text(json.dumps(cfg, indent=2, ensure_ascii=False))
          PY
          lftp -u "$SFTP_USERNAME","$SFTP_PASSWORD" -p "$SFTP_PORT" "sftp://$SFTP_HOST" <<EOF
          set sftp:auto-confirm yes
          set net:timeout 30
          set net:max-retries 2
          mkdir -p "$SFTP_TARGET/data"
          put .deploy_runtime/config.json -o "$SFTP_TARGET/data/config.json"
          bye
          EOF
