<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Devil AI logo">
  <defs>
    <radialGradient id="faceGrad" cx="38%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#ff7a4d"/>
      <stop offset="45%" stop-color="#e5383b"/>
      <stop offset="100%" stop-color="#5c0a0e"/>
    </radialGradient>
    <radialGradient id="bgGlow" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#e11d48" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#e11d48" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hornGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#9f1239"/>
      <stop offset="100%" stop-color="#ff5a5f"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ambient glow -->
  <circle cx="64" cy="58" r="58" fill="url(#bgGlow)"/>

  <!-- horns -->
  <path d="M30 44 C22 26 25 12 34 4 C38 20 46 30 54 36 Z" fill="url(#hornGrad)"/>
  <path d="M98 44 C106 26 103 12 94 4 C90 20 82 30 74 36 Z" fill="url(#hornGrad)"/>

  <!-- face -->
  <circle cx="64" cy="70" r="42" fill="url(#faceGrad)"/>
  <path d="M64 28 a42 42 0 0 1 0 84 a58 58 0 0 0 0 -84" fill="#000000" opacity="0.12"/>

  <!-- glowing eyes -->
  <g fill="#ffe066" filter="url(#softGlow)">
    <path d="M38 62 L56 68.5 L38 75 Z"/>
    <path d="M90 62 L72 68.5 L90 75 Z"/>
  </g>

  <!-- wicked smile -->
  <path d="M44 88 Q64 102 84 88" fill="none" stroke="#33060a" stroke-width="5" stroke-linecap="round"/>

  <!-- fangs -->
  <path d="M53 91 L58 91.6 L55.5 99 Z" fill="#fff5f5"/>
  <path d="M75 91 L70 91.6 L72.5 99 Z" fill="#fff5f5"/>

  <!-- floating embers -->
  <circle cx="24" cy="18" r="2.4" fill="#fb7185" opacity="0.9"/>
  <circle cx="104" cy="24" r="1.8" fill="#fda4af" opacity="0.8"/>
  <circle cx="112" cy="60" r="1.5" fill="#fb7185" opacity="0.6"/>
  <circle cx="14" cy="66" r="1.6" fill="#fda4af" opacity="0.5"/>
  <circle cx="98" cy="10" r="1.2" fill="#fecdd3" opacity="0.7"/>
</svg>
